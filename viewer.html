<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #000; }
    img { width: 100vw; height: 100vh; object-fit: contain; display: block; }
  </style>
</head>
<body>
  <img id="screen" />
  <script>
    function refresh() {
      document.getElementById('screen').src = 
        'https://drive.google.com/uc?export=view&id=1yu5pzD76ZrLTxxy4sNyH-83E72MVSFUN&t=' + Date.now();
    }
    setInterval(refresh, 3000);
    refresh();
  </script>
</body>
</html>
