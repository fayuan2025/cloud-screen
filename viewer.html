<!DOCTYPE html>
<html>
<head>
  <title>云电脑屏幕</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #000; }
    img { width: 100vw; height: 100vh; object-fit: contain; display: block; }
  </style>
</head>
<body>
  <img id="screen" />
  <script>
    function refresh() {
      document.getElementById('screen').src = 
        'https://raw.githubusercontent.com/fayuan2025/cloud-screen/main/screen.jpg?t=' + Date.now();
    }
    setInterval(refresh, 3000);
    refresh();
  </script>
</body>
</html>
